name: Mutation testing

# Semanal + manual: mutation testing e lento demais para gate de PR.
# O score do domain layer (RN-01..RN-08) e a metrica de qualidade dos testes.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  mutation:
    name: Stryker (src/domain)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Stryker
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
